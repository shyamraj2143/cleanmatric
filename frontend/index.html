<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111a3d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MetricFlow | Sign in</title>
    <script>
      window.__METRICFLOW_CONFIG__ = window.__METRICFLOW_CONFIG__ || {};
      window.__METRICFLOW_BOOTED__ = false;
      window.setTimeout(function () {
        if (window.__METRICFLOW_BOOTED__) return;
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f7fb;font-family:Inter,system-ui,sans-serif;color:#17213f"><section style="max-width:560px;padding:32px;border:1px solid #dfe3ef;border-radius:18px;background:#fff;box-shadow:0 18px 50px rgba(31,45,91,.12);text-align:center"><h1 style="margin:0 0 12px;font-size:26px">MetricFlow could not start</h1><p style="margin:0 0 20px;line-height:1.6;color:#5f6880">The application files may be stale or incomplete. Refresh once to load the latest deployment.</p><button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 20px;background:#5d6df6;color:#fff;font-weight:700;cursor:pointer">Reload application</button></section></main>';
      }, 12000);
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#f6f7fb;font-family:Inter,system-ui,sans-serif;color:#17213f">Loading MetricFlow…</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
