name: CleanMetric CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
        env:
          PYTHONPATH: .
          JWT_SECRET: ci-test-secret-that-is-long-enough
          DATABASE_URL: sqlite:///./ci.db
          ALLOWED_ORIGIN: http://localhost:3000

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Railway production image from repository root
        run: docker build --tag cleanmetric-backend:ci .
      - name: Smoke test production container
        run: |
          docker run --detach --rm \
            --name cleanmetric-backend-ci \
            --publish 8080:8080 \
            --env PORT=8080 \
            --env JWT_SECRET=ci-container-secret-that-is-long-enough \
            --env DATABASE_URL=sqlite:////data/ci.db \
            --env ALLOWED_ORIGIN=http://localhost:3000 \
            cleanmetric-backend:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              curl --fail --silent --show-error http://127.0.0.1:8080/api/public/config | grep -q 'google_sign_in_enabled'
              exit 0
            fi
            sleep 2
          done

          docker logs cleanmetric-backend-ci
          exit 1
      - name: Stop smoke-test container
        if: always()
        run: docker stop cleanmetric-backend-ci || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://amusing-renewal-production.up.railway.app
          VITE_GOOGLE_WEB_CLIENT_ID: 776507506876-vjrrc9m5eer82k6digta7ie2phd4l1f8.apps.googleusercontent.com
      - name: Verify stable production bundle
        run: |
          test -f dist/assets/app.js
          test -f dist/assets/app.css
          grep -q '/assets/app.js' dist/index.html

  frontend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production frontend image
        run: docker build --tag cleanmetric-frontend:ci frontend
      - name: Smoke test frontend, runtime config, SPA shell, and cache policy
        run: |
          docker run --detach --rm \
            --name cleanmetric-frontend-ci \
            --publish 3000:3000 \
            --env PORT=3000 \
            --env VITE_API_BASE_URL=https://amusing-renewal-production.up.railway.app \
            --env VITE_GOOGLE_WEB_CLIENT_ID=776507506876-vjrrc9m5eer82k6digta7ie2phd4l1f8.apps.googleusercontent.com \
            cleanmetric-frontend:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health; then
              curl --fail --silent --show-error http://127.0.0.1:3000/config.js | grep -q 'VITE_GOOGLE_WEB_CLIENT_ID'
              curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q '/assets/app.js'
              curl --fail --silent --show-error http://127.0.0.1:3000/assets/app.js >/dev/null
              curl --silent --show-error --head http://127.0.0.1:3000/ | grep -qi 'cache-control: no-store'
              exit 0
            fi
            sleep 2
          done

          docker logs cleanmetric-frontend-ci
          exit 1
      - name: Stop frontend smoke-test container
        if: always()
        run: docker stop cleanmetric-frontend-ci || true
