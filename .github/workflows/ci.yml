name: CleanMetric CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
        env:
          PYTHONPATH: .
          JWT_SECRET: ci-test-secret-that-is-long-enough
          DATABASE_URL: sqlite:///./ci.db
          ALLOWED_ORIGIN: http://localhost:3000

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend image
        run: docker build --tag cleanmetric-backend:ci ./backend
      - name: Smoke test production container
        run: |
          docker run --detach --rm \
            --name cleanmetric-backend-ci \
            --publish 5000:5000 \
            --env PORT=5000 \
            --env JWT_SECRET=ci-container-secret-that-is-long-enough \
            --env DATABASE_URL=sqlite:////data/ci.db \
            --env ALLOWED_ORIGIN=http://localhost:3000 \
            cleanmetric-backend:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs cleanmetric-backend-ci
          exit 1
      - name: Stop smoke-test container
        if: always()
        run: docker stop cleanmetric-backend-ci || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
